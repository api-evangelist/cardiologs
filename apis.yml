name: Cardiologs
description: 'Cardiologs is a cloud-based ECG analysis platform that uses clinically validated
  artificial intelligence to streamline cardiac diagnostics, helping clinicians and healthcare
  providers reduce the burden of manual ECG interpretation while improving diagnostic scalability
  and accessibility. Founded in Paris in 2014, Cardiologs was acquired by Philips in 2021 and is
  now offered as part of Philips ambulatory monitoring and diagnostics (ECG monitoring) portfolio.
  The company publishes no public developer API, SDK, or developer portal; its primary domain
  redirects to the Philips healthcare product page.'
